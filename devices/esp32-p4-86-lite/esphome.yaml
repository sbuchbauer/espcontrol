# =============================================================================
# ESPHOME ENTRY POINT - ESP32-P4 86 Panel (no relays / WiFi-only variant)
# =============================================================================
# User-facing config file. Set your device name and WiFi credentials here.
# The remote package reference pulls in the full device configuration from
# this fork so the device stays up-to-date automatically.
# =============================================================================

# ---------------------------------------------------------------------------
# Device identity
# ---------------------------------------------------------------------------
substitutions:
  name: "your-device-name"
  friendly_name: "Your Device Name"

# ---------------------------------------------------------------------------
# WiFi credentials (stored in secrets.yaml)
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------------------
# Remote package (pulls full config from this fork)
# ---------------------------------------------------------------------------
packages:
  setup:
    url: https://github.com/sbuchbauer/espcontrol/
    file: devices/esp32-p4-86-lite/packages.yaml
    refresh: 1s
