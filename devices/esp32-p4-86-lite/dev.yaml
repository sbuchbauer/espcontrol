# =============================================================================
# DEV CONFIG - Local development entry point (P4-86 panel, no relays/ethernet)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  name: "espcontrol-p4-86-lite"
  friendly_name: "EspControl P4-86 Lite"
  espcontrol_component_url: "../.."
  mdi_font_file: "../../common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espcontrol_component_ref: "HEAD"
  voice_wake_chime_file: "../esp32-p4-86/device/voice_wake_chime.flac"
  voice_timer_alert_file: "../esp32-p4-86/device/voice_timer_alert.flac"
  voice_stt_failure_chime_file: "../esp32-p4-86/device/voice_stt_failure_chime.flac"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  espcontrol: !include packages.yaml

web_server:
  js_url: ""
  js_include: "../../docs/public/webserver/esp32-p4-86-lite/www.js"
